# 常规检查：编译、Lint、单元测试。
# 使用 pull_request（不是 pull_request_target），来自 fork 的 PR 拿不到任何 secret；本工作流也不引用任何 secret。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report runner resources
        # 记录托管 runner 的实际资源，作为“能否在 CI 上构建完整 Chromium”评估的证据（只读命令，不涉及任何 secret）
        run: |
          echo "CPU: $(nproc)"; free -g; df -h / "$GITHUB_WORKSPACE" | sort -u

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # PR 只读缓存，避免不可信代码写入共享缓存
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Lint, unit tests, debug build
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
